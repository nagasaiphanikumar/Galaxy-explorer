<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galaxy Explorer</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:#01030a;
}

#bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 50% 45%,#182653,#050918 40%,#010207 85%);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
    radial-gradient(#fff 1px,transparent 1px),
    radial-gradient(#69dfff 1px,transparent 1px);
    background-size:90px 90px,150px 150px;
    animation:stars 35s linear infinite;
    opacity:.6;
}

@keyframes stars{
    to{
        background-position:500px 350px,700px 500px;
    }
}

.glow{
    position:absolute;
    width:60vw;
    height:60vw;
    left:20%;
    top:10%;
    border-radius:50%;
    background:
    conic-gradient(
        #6d36ff22,
        #18cfff18,
        #ff3fba15,
        #1d64ff18,
        #6d36ff22
    );
    filter:blur(50px);
    animation:rotate 50s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

.app{
    position:relative;
    z-index:2;
    height:100vh;
    padding:20px;
    display:flex;
    flex-direction:column;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:4px;
    color:#69e7ff;
}

.logo small{
    display:block;
    color:#687893;
    font-size:8px;
    letter-spacing:2px;
    margin-top:4px;
}

.live{
    border:1px solid #205d78;
    background:#06111ddd;
    border-radius:20px;
    padding:8px 12px;
    color:#83ecff;
    font-size:10px;
}


/* ---------- SCREENS ---------- */

.screen{
    display:none;
    flex:1;
    min-height:0;
}

.screen.active{
    display:flex;
    animation:appear .35s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}


/* ---------- WELCOME ---------- */

.welcome{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

.welcome h1{
    margin:0;
    font-size:clamp(40px,7vw,90px);
    letter-spacing:8px;
    text-shadow:0 0 45px #4ee2ff66;
}

.welcome p{
    color:#8b98ae;
    letter-spacing:5px;
    font-size:11px;
}

.enter{
    margin-top:25px;
    padding:14px 27px;
    border-radius:12px;
    border:1px solid #42dcff;
    background:#061522dd;
    color:#b6f5ff;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 0 30px #32dfff22;
}

.enter:hover{
    background:#0b2a3a;
}


/* ---------- GALAXY OBJECTS ---------- */

.galaxy{
    flex-direction:column;
    align-items:center;
    padding-top:18px;
}

.title{
    text-align:center;
}

.title h2{
    font-size:30px;
    letter-spacing:4px;
    margin:5px;
}

.title p{
    color:#6f7d96;
    font-size:10px;
    letter-spacing:2px;
}

.objects{
    width:min(1100px,100%);
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:11px;
    margin:auto 0;
}

.object{
    min-height:135px;
    text-align:left;
    padding:15px;
    border:1px solid #1a3b54;
    border-radius:16px;
    background:#07111ee8;
    color:white;
    cursor:pointer;
    transition:.22s;
    position:relative;
}

.object:hover{
    transform:translateY(-5px);
    border-color:#42dcff;
    box-shadow:0 12px 35px #25a9ff20;
}

.ico{
    font-size:35px;
}

.object b{
    display:block;
    margin-top:8px;
}

.object small{
    display:block;
    margin-top:5px;
    color:#71809a;
}


/* ---------- DETAIL ---------- */

.detail{
    flex-direction:column;
}

.detailbar{
    height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.nav{
    display:flex;
    gap:8px;
}

.nav button{
    border:1px solid #274b63;
    background:#06111cdd;
    color:#a2efff;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
}

.nav button:hover{
    border-color:#52e2ff;
    background:#0a2433;
}

.crumb{
    color:#63728a;
    font-size:10px;
    letter-spacing:2px;
}

.detailmain{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:3%;
}

.visual{
    height:min(72vh,620px);
    display:grid;
    place-items:center;
    position:relative;
}

#object3d{
    width:min(540px,48vw);
    height:min(540px,48vw);
    display:block;
    filter:drop-shadow(0 0 35px #24bfff30);
}

.visualLabel{
    position:absolute;
    bottom:7%;
    color:#65748d;
    font-size:9px;
    letter-spacing:2px;
}

.info{
    width:min(520px,100%);
    padding:25px;
    border:1px solid #1e526b;
    border-radius:20px;
    background:#050b16e8;
    backdrop-filter:blur(15px);
}

.code{
    color:#48e2ff;
    font-size:9px;
    letter-spacing:2px;
}

.info h1{
    font-size:44px;
    margin:8px 0;
}

.lead{
    color:#96a5bb;
    font-size:13px;
    line-height:1.7;
}

.facts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.fact{
    padding:11px;
    border:1px solid #1a3a4e;
    background:#ffffff05;
    border-radius:10px;
}

.fact small{
    display:block;
    color:#65758c;
    font-size:8px;
    margin-bottom:4px;
}

.fact b{
    font-size:12px;
}

.info h3{
    font-size:11px;
    margin-top:18px;
}

.tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.tags span{
    padding:7px 9px;
    border:1px solid #1a4157;
    background:#ffffff06;
    border-radius:8px;
    font-size:10px;
}

.extra{
    color:#8291a8;
    font-size:11px;
    line-height:1.65;
}

.actionRow{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.action{
    border:1px solid #28617d;
    background:#071722;
    color:#9beeff;
    border-radius:9px;
    padding:10px 13px;
    cursor:pointer;
}

.action:hover{
    background:#0c2a3b;
}


/* ---------- MOBILE ---------- */

@media(max-width:850px){

    .objects{
        grid-template-columns:repeat(2,1fr);
        overflow:auto;
        margin:16px 0;
    }

    .detailmain{
        grid-template-columns:1fr;
        overflow:auto;
    }

    .visual{
        height:280px;
    }

    #object3d{
        width:260px;
        height:260px;
    }

    .info{
        margin:0 auto 12px;
    }
}

@media(max-width:520px){

    .objects{
        grid-template-columns:1fr 1fr;
    }

    .visual{
        height:220px;
    }

    #object3d{
        width:205px;
        height:205px;
    }

    .info h1{
        font-size:28px;
    }
}
</style>
</head>

</section>

</div>

const objectList=[

objectList.forEach(item=>{

    const button=document.createElement("button");

    button.className="object";

    button.innerHTML=`

        <div class="ico">${item[0]}</div>

        <b>${item[1]}</b>

    button.onclick=()=>openObject(item[1]);

    document.getElementById("objects")

/* =====================================================
   NAVIGATION
===================================================== */

function showScreen(screen){

    document
        .querySelectorAll(".screen")
        .forEach(s=>s.classList.remove("active"));

    screen.classList.add("active");
}


document.getElementById("enter").onclick=()=>{

    showScreen(
        document.getElementById("galaxy")
    );

};


document.getElementById("back").onclick=()=>{

    showScreen(
        document.getElementById("galaxy")
    );

};


/* X = BACK */

document.getElementById("close").onclick=()=>{

    showScreen(
        document.getElementById("galaxy")
    );

};


/* HOME */

document.getElementById("home").onclick=()=>{

    showScreen(
        document.getElementById("welcome")
    );

};


/* =====================================================
   OPEN OBJECT
===================================================== */

let current="Earth";

function openObject(name){

    if(!DATA[name]) return;

    current=name;

    const d=DATA[name];

    showScreen(
        document.getElementById("detail")
    );


    document.getElementById("crumb")
        .textContent=name.toUpperCase();


    document.getElementById("code")
        .textContent=d.type;


    document.getElementById("dname")
        .textContent=name;


    document.getElementById("desc")
        .textContent=d.desc;


    document.getElementById("extra")
        .textContent=d.extra;


    document.getElementById("facts").innerHTML=

        d.facts.map(f=>`

            <div class="fact">

                <small>
                    KEY INFORMATION
                </small>

                <b>${f}</b>

            </div>

        `).join("");


    document.getElementById("tags").innerHTML=

        d.tags.map(t=>`

            <span>${t}</span>

        `).join("");


    rotation=0;

}


/* =====================================================
   PREVIOUS / NEXT PLANETS
===================================================== */

const planets=[

"Sun",
"Mercury",
"Venus",
"Earth",
"Moon",
"Mars",
"Jupiter",
"Saturn",
"Uranus",
"Neptune"

];


document.getElementById("prev").onclick=()=>{

    let index=planets.indexOf(current);

    if(index<0) index=0;

    index--;

    if(index<0)
        index=planets.length-1;

    openObject(planets[index]);

};


document.getElementById("next").onclick=()=>{

    let index=planets.indexOf(current);

    if(index<0) index=0;

    index++;

    if(index>=planets.length)
        index=0;

    openObject(planets[index]);

};


/* =====================================================
   3D CANVAS
===================================================== */

const canvas=
    document.getElementById("object3d");

const ctx=
    canvas.getContext("2d");

let rotation=0;

let dragging=false;

let lastX=0;


/* DRAW SPHERE */

function drawSphere(kind){

    const W=600;
    const H=600;

    ctx.clearRect(0,0,W,H);

    const cx=300;
    const cy=300;
    const R=205;

    const image=
        ctx.createImageData(W,H);

    const pixels=image.data;


    for(
        let y=cy-R;
        y<=cy+R;
        y++
    ){

        for(
            let x=cx-R;
            x<=cx+R;
            x++
        ){

            const dx=x-cx;
            const dy=y-cy;

            const dist=
                dx*dx+dy*dy;

            if(dist>R*R)
                continue;


            const z=
                Math.sqrt(
                    R*R-dist
                );


            let nx=dx/R;
            let ny=dy/R;
            let nz=z/R;


            /* ROTATION */

            const cos=Math.cos(rotation);
            const sin=Math.sin(rotation);

            const rx=
                nx*cos+nz*sin;

            const rz=
                -nx*sin+nz*cos;


            let r=100;
            let g=120;
            let b=160;


            /* EARTH */

            if(kind==="earth"){

                const land=
                    Math.sin(rx*8+ny*5)+
                    Math.sin(rx*15-ny*9)+
                    Math.sin(rz*13+ny*7);

                if(land>1){

                    r=55;
                    g=150;
                    b=70;

                }else{

                    r=30;
                    g=100;
                    b=190;

                }

            }


            /* MARS */

            if(kind==="mars"){

                r=160+
                    Math.sin(rx*10)*40;

                g=60+
                    Math.sin(ny*8)*20;

                b=40;

            }


            /* JUPITER */

            if(kind==="jupiter"){

                const band=
                    Math.sin(ny*28);

                if(band>0){

                    r=220;
                    g=185;
                    b=140;

                }else{

                    r=150;
                    g=100;
                    b=75;

                }

            }


            /* SATURN */

            if(kind==="saturn"){

                const band=
                    Math.sin(ny*32);

                r=205+band*20;
                g=170+band*15;
                b=100+band*10;

            }


            /* VENUS */

            if(kind==="venus"){

                const band=
                    Math.sin(ny*30);

                r=210+band*15;
                g=150+band*15;
                b=70;

            }


            /* MERCURY */

            if(kind==="mercury"){

                const craters=
                    Math.sin(rx*22+ny*15);

                r=120+craters*35;
                g=115+craters*32;
                b=105+craters*25;

            }


            /* URANUS */

            if(kind==="uranus"){

                r=85;
                g=195;
                b=210;

            }


            /* NEPTUNE */

            if(kind==="neptune"){

                r=45;
                g=90;
                b=215;

            }


            /* MOON */

            if(kind==="moon"){

                const craters=
                    Math.sin(rx*20+ny*18);

                r=135+craters*30;
                g=135+craters*30;
                b=140+craters*28;

            }


            /* GENERIC PLANET */

            if(kind==="planet"){

                const band=
                    Math.sin(ny*25);

                r=180+band*20;
                g=140+band*18;
                b=100+band*15;

            }


            /* LIGHTING */

            const light=

                Math.max(
                    0,
                    nx*(-.45)+
                    ny*(-.35)+
                    nz*.82
                );


            const shade=
                .18+light*.92;


            const index=
                (y*W+x)*4;


            pixels[index]=
                Math.min(
                    255,
                    r*shade
                );

            pixels[index+1]=
                Math.min(
                    255,
                    g*shade
                );

            pixels[index+2]=
                Math.min(
                    255,
                    b*shade
                );

            pixels[index+3]=255;

        }

    }


    ctx.putImageData(image,0,0);


    /* SATURN RINGS */

    if(kind==="saturn"){

        ctx.save();

        ctx.translate(cx,cy);

        ctx.rotate(-.25);

        ctx.strokeStyle="#e5cc8d99";

        ctx.lineWidth=18;

        ctx.beginPath();

        ctx.ellipse(
            0,0,
            310,
            85,
            0,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }


    /* SUN */

    if(kind==="sun" || kind==="star"){

        const glow=
            ctx.createRadialGradient(
                300,300,20,
                300,300,240
            );

        glow.addColorStop(
            0,
            "#fffbd0"
        );

        glow.addColorStop(
            .3,
            "#fff080"
        );

        glow.addColorStop(
            .6,
            "#ff9e22"
        );

        glow.addColorStop(
            1,
            "transparent"
        );

        ctx.fillStyle=glow;

        ctx.beginPath();

        ctx.arc(
            300,300,
            240,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   OTHER 3D OBJECTS
===================================================== */

function drawBlackHole(){

    ctx.clearRect(0,0,600,600);

    const disk=
        ctx.createRadialGradient(
            300,300,50,
            300,300,260
        );

    disk.addColorStop(
        0,
        "#000"
    );

    disk.addColorStop(
        .3,
        "#000"
    );

    disk.addColorStop(
        .45,
        "#ffd04c"
    );

    disk.addColorStop(
        .58,
        "#ff5a20"
    );

    disk.addColorStop(
        .75,
        "#743cff55"
    );

    disk.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=disk;

    ctx.beginPath();

    ctx.ellipse(
        300,
        300,
        260,
        105,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.arc(
        300,
        300,
        85,
        0,
        Math.PI*2
    );

    ctx.fill();

}


function drawGalaxy(){

    ctx.clearRect(0,0,600,600);

    ctx.save();

    ctx.translate(300,300);

    for(let i=0;i<500;i++){

        const arm=i%4;

        const angle=
            i*.15+
            arm*Math.PI/2;

        const radius=
            10+
            (i/500)*270;

        const x=
            Math.cos(angle)*radius;

        const y=
            Math.sin(angle)*radius*.42;

        ctx.fillStyle=
            i%8===0
            ? "#fff5bd"
            : "#79c7ff";

        ctx.globalAlpha=
            .25+
            Math.random()*.6;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            1+(i%4),
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.restore();

}


function drawNebula(){

    ctx.clearRect(0,0,600,600);

    const g=
        ctx.createRadialGradient(
            300,300,20,
            300,300,270
        );

    g.addColorStop(
        0,
        "#ffffff55"
    );

    g.addColorStop(
        .3,
        "#9a50ff66"
    );

    g.addColorStop(
        .6,
        "#28d9ff33"
    );

    g.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        20,
        20,
        560,
        560
    );

}


/* =====================================================
   OBJECT RENDER LOOP
===================================================== */

function render(){

    if(
        detail.classList.contains("active")
        && !dragging
    ){

        rotation+=0.008;

    }


    const kind=
        DATA[current]
        ? DATA[current].kind
        : "earth";


    if(kind==="blackhole")
        drawBlackHole();

    else if(kind==="galaxy")
        drawGalaxy();

    else if(kind==="nebula")
        drawNebula();

    else
        drawSphere(kind);


    requestAnimationFrame(render);

}

render();


/* =====================================================
   DRAG TO ROTATE
===================================================== */

canvas.onmousedown=e=>{

    dragging=true;

    lastX=e.clientX;

};


window.onmouseup=()=>{

    dragging=false;

};


window.onmousemove=e=>{

    if(!dragging)
        return;

    rotation+=
        (e.clientX-lastX)*.01;

    lastX=e.clientX;

};


/* TOUCH */

canvas.ontouchstart=e=>{

    dragging=true;

    lastX=
        e.touches[0].clientX;

};


window.ontouchend=()=>{

    dragging=false;

};


window.ontouchmove=e=>{

    if(!dragging)
        return;

    rotation+=
        (e.touches[0].clientX-lastX)*.01;

    lastX=
        e.touches[0].clientX;

};

</script>
